name: Publish signed personal release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release-for-github:
    name: "Build and publish Pcloud Media Manager APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release secrets
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the standard ARM64 release
        env:
          PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Get tag name
        run: echo "VERSION_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Verify single APK output
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/standard/release"
          APK="$APK_DIR/app-standard-arm64-v8a-release-unsigned.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error file=$APK::The standard ARM64 APK was not found."
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)
          if [[ "$APK_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one APK in $APK_DIR, found $APK_COUNT."
            ls -lah "$APK_DIR"
            exit 1
          fi

      - name: Sign and verify ARM64 APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found in the installed build tools."
            exit 1
          fi

          UNSIGNED_APK="app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned.apk"
          SIGNED_APK="${UNSIGNED_APK/-unsigned/}"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify "$SIGNED_APK"
          rm "$UNSIGNED_APK"

      - name: Copy Pcloud Media Manager APK and calculate checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release.apk"
          RELEASE_APK="Pcloud-Media-Manager-arm64-v8a-${VERSION_TAG}.apk"
          cp "$APK" "$RELEASE_APK"
          CHECKSUM=$(sha256sum "$RELEASE_APK" | awk '{ print $1 }')
          echo "apk_sha256=$CHECKSUM" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Pcloud Media Manager ${{ env.VERSION_TAG }}
          body: |
            ### What's new
            - Unified local media library for Movies, TV Shows, Photos, and Music, with search and in-app photo viewing.
            - Dedicated audio-only player with queue, seek, shuffle, repeat, background playback, and media controls.
            - pCloud browsing now filters Videos, Photos, and Music; network sources expose audio and image files too.
            - pCloud OAuth sign-in and direct cloud browsing/streaming (requires PCLOUD_CLIENT_ID Actions secret).
            - RAW photo viewing can show embedded previews (including CR2) when available.
            - Missing local music album art can be fetched from MusicBrainz and Cover Art Archive.
            - Pcloud Media Manager personal ARM64 release: one signed APK.

            **SHA-256:** ${{ env.apk_sha256 }}
          files: Pcloud-Media-Manager-arm64-v8a-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
