name: Make Pre release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

jobs:
  release-for-github:
    name: "Preview Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release signing secrets
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assembleStandardPreview --stacktrace

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$PREVIEW_DIR"

      - name: Sign APKs
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found in the installed build tools."
            exit 1
          fi

          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          APK_COUNT=$(find "$PREVIEW_DIR" -name "app-standard-*-preview-unsigned.apk" -type f | wc -l)
          if [[ "$APK_COUNT" -eq 0 ]]; then
            echo "::error::No unsigned preview APK files were found."
            ls -lah "$PREVIEW_DIR"
            exit 1
          fi

          while IFS= read -r -d '' apk; do
            signed_apk="${apk/-unsigned/}"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$signed_apk" \
              "$apk"
            "$APKSIGNER" verify "$signed_apk"
            rm "$apk"
          done < <(find "$PREVIEW_DIR" -type f -name "app-standard-*-preview-unsigned.apk" -print0)

          ls -lh "$PREVIEW_DIR"/app-standard-*-preview.apk

      - name: Copy built artifacts
        run: |
          set -e
          mkdir -p preview
          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/standard/preview/app-standard-${abi}-preview.apk"
            dest="preview/mpvEx-preview-${abi}-${{ env.VERSION_TAG }}.apk"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
              sha=$(sha256sum "$dest" | awk '{ print $1 }')
              echo "apk-${abi}-sha256=$sha" >> $GITHUB_ENV
            fi
          done

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "mpvEx ${{ env.VERSION_TAG }}"
          body: |
            
            ### Checksums
            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk-arm64-v8a-sha256 }} |
            | armeabi-v7a | ${{ env.apk-armeabi-v7a-sha256 }} |
            | Universal | ${{ env.apk-universal-sha256 }} |
            | x86 | ${{ env.apk-x86-sha256 }} |
            | x86_64 | ${{ env.apk-x86_64-sha256 }} |
          files: |
            preview/mpvEx-preview-universal-${{ env.VERSION_TAG }}.apk
            preview/mpvEx-preview-arm64-v8a-${{ env.VERSION_TAG }}.apk
            preview/mpvEx-preview-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            preview/mpvEx-preview-x86-${{ env.VERSION_TAG }}.apk
            preview/mpvEx-preview-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
