name: CI/CD Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build arm64 debug test APK
        run: ./gradlew assembleStandardDebug -Pandroid.injected.build.abi=arm64-v8a --max-workers=1

      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          find app/build -type f -name '*standard*debug*.apk' -print
          APK_PATH="$(find app/build -type f -name '*standard*debug*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Gradle completed but no standard debug APK was found."
            find app/build -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK_PATH" NeoPlayerDave-arm64-debug-test.apk

      - name: Upload installable arm64 debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-arm64-v8a-debug-test-${{ env.SHORT_SHA }}
          path: NeoPlayerDave-arm64-debug-test.apk
          if-no-files-found: error
