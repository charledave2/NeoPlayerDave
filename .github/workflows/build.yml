name: Signed test build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sign-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in SIGNING_KEYSTORE SIGNING_KEY_ALIAS SIGNING_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build standard release ARM64 APK
        run: ./gradlew assembleStandardRelease -Pandroid.injected.build.abi=arm64-v8a --max-workers=1

      - name: Sign and verify release APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/neoplayerdave-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"

          APK_PATH="$(find app/build -type f -name 'app-standard-arm64-v8a-release-unsigned.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Gradle did not produce the expected standard ARM64 release APK."
            find app/build -type f -name '*standard*release*.apk' -print
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found in the installed build tools."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/NeoPlayerDave-arm64-release-signed.apk" \
            "$APK_PATH"

          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/NeoPlayerDave-arm64-release-signed.apk"
          cp "$RUNNER_TEMP/NeoPlayerDave-arm64-release-signed.apk" NeoPlayerDave-arm64-release-signed.apk

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoPlayerDave-arm64-release-signed-test-${{ github.sha }}
          path: NeoPlayerDave-arm64-release-signed.apk
          if-no-files-found: error
